<!-- AJOUT CSS -->
<style>
/* ===== CONTACT FLOTTANT ===== */
.floating-contact{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:10000;
}

.contact-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  color:white;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
}

.contact-item:hover{
  transform:translateY(-2px);
  background:rgba(0,0,0,.7);
}

/* ICONES */
.contact-icon{
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* TELEPHONE ORANGE */
.phone-icon svg{
  fill:var(--accent);
}

/* MAIL PREMIUM */
.mail-icon svg{
  fill:white;
}

/* WHATSAPP */
.whatsapp-icon svg{
  fill:#25D366;
}
</style>
