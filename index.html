<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidenc’IA — Vos assistants</title>

  <style>
    :root{
      --bg1:#05060a;
      --bg2:#0a0d16;
      --ink:#eef2ff;
      --muted:rgba(238,242,255,.72);

      --cardRadius:26px;
      --shadow:0 24px 70px rgba(0,0,0,.55);
      --shadowSoft:0 14px 40px rgba(0,0,0,.45);

      --line:rgba(255,255,255,.10);
      --wa:#25D366;

      --bubbleShift:34px;
    }

    /* ===== MODE CLAIR ===== */
    :root[data-theme="light"]{
      --bg1:#f6f7fb;
      --bg2:#ffffff;
      --ink:#0b0d17;
      --muted:rgba(11,13,23,.65);

      --line:rgba(0,0,0,.10);

      --shadow:0 24px 60px rgba(0,0,0,.15);
      --shadowSoft:0 14px 30px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:"Segoe UI", Arial, sans-serif;
      color:var(--ink);
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
      transition:background .25s ease,color .25s ease;
    }

    /* ===== THEME SWITCH ===== */
    .theme-switch{
      position:fixed;
      top:16px;
      right:240px;
      z-index:10001;

      width:42px;
      height:42px;
      border-radius:50%;
      border:1px solid var(--line);

      background:rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
      box-shadow:0 14px 40px rgba(0,0,0,.45);

      color:var(--ink);
      font-size:18px;
      cursor:pointer;

      display:flex;
      align-items:center;
      justify-content:center;
      transition:.15s ease;
    }

    .theme-switch:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.12);
    }

    @media(max-width:720px){
      .theme-switch{
        right:16px;
        top:70px;
      }
    }

    /* ===== CTA LOGIN ===== */
    .top-cta{
      position:fixed;
      top:16px;
      right:16px;
      z-index:10000;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid var(--line);
      backdrop-filter:blur(10px);
      box-shadow:0 14px 40px rgba(0,0,0,.45);
      color:var(--ink);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
    }

    .top-cta svg{width:18px;height:18px;fill:currentColor}

    /* ===== HERO ===== */
    .hero{
      height:100vh;
      background:url("images/logopc.png") center/cover no-repeat;
      position:relative;
    }

    @media(max-width:768px){
      .hero{
        background:url("images/logomobile.png") center 10%/cover no-repeat;
      }
    }

    .hero::after{
      content:"";
      position:absolute;inset:0;
      background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.25));
    }

    /* ===== SECTION ===== */
    .section{
      padding:70px 6vw 55px;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
    }

    .section h2{
      text-align:center;
      font-size:44px;
      margin-bottom:52px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:34px;
    }

    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
      .section h2{font-size:32px}
    }

    /* ===== AGENTS ===== */
    .agent{
      position:relative;
      height:560px;
      border-radius:26px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
      transition:.2s ease;
    }

    .agent:hover{
      transform:translateY(-6px);
    }

    .media{
      position:absolute;
      inset:0;
      padding:12px 12px 165px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .media img{
      width:100%;
      height:100%;
      object-fit:contain;
      transform:translateY(var(--bubbleShift)) scale(1.18);
      filter:drop-shadow(0 28px 52px rgba(0,0,0,.6));
    }

    .overlay{
      position:absolute;
      bottom:18px;
      left:18px;
      right:18px;
    }

    .box{
      background:rgba(0,0,0,.45);
      border-radius:18px;
      padding:18px;
      border:1px solid var(--line);
      backdrop-filter:blur(10px);
    }

    :root[data-theme="light"] .box{
      background:rgba(255,255,255,.85);
    }

    .box h3{margin:0;font-size:26px}
    .box strong{display:block;margin:6px 0 10px}
    .box p{font-size:14px;color:var(--muted)}
    .box a{
      display:inline-block;
      padding:10px 16px;
      border-radius:999px;
      border:1px solid var(--line);
      text-decoration:none;
      color:var(--ink);
      font-weight:900;
    }

    /* ===== FOOTER ===== */
    footer{
      text-align:center;
      padding:40px;
      border-top:1px solid var(--line);
      font-size:13px;
      color:var(--muted);
    }
  </style>
</head>

<body>

  <!-- SWITCH -->
  <button class="theme-switch" aria-label="Changer le thème">
    <span class="icon">🌙</span>
  </button>

  <!-- LOGIN -->
  <a class="top-cta" href="https://evidencia-app.vercel.app/login">
    <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/></svg>
    Connectez-vous à vos agents
  </a>

  <section class="hero"></section>

  <section class="section">
    <h2>Vos assistants</h2>
    <div class="grid">

      <!-- Exemple -->
      <article class="agent">
        <div class="media"><img src="images/chloe.png" alt="Chloé"></div>
        <div class="overlay">
          <div class="box">
            <h3>Chloé</h3>
            <strong>Standardiste</strong>
            <p>Toujours à l'écoute 24/7.</p>
            <a href="agents/chloe.html">En savoir plus</a>
          </div>
        </div>
      </article>

      <!-- Tu peux dupliquer les autres agents ici -->

    </div>
  </section>

  <footer>© 2025 Evidenc’IA — Tous droits réservés</footer>

  <script>
    const root = document.documentElement;
    const btn = document.querySelector('.theme-switch');
    const icon = btn.querySelector('.icon');

    const saved = localStorage.getItem('theme');
    if(saved){
      root.setAttribute('data-theme', saved);
      icon.textContent = saved === 'light' ? '🌞' : '🌙';
    }

    btn.addEventListener('click',()=>{
      const isLight = root.getAttribute('data-theme') === 'light';
      const theme = isLight ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      icon.textContent = theme === 'light' ? '🌞' : '🌙';
    });
  </script>

</body>
</html>
