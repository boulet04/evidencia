<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evidenc’IA – Nos agents IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            width: 100%;
            background:
                linear-gradient(
                    rgba(0,0,0,0.55),
                    rgba(0,0,0,0.65)
                ),
                url("images/logo.png") center center / contain no-repeat,
                #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 900px;
        }

        .brand {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand span {
            color: #ff9f1a;
        }

        .tagline {
            margin-top: 20px;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            line-height: 1.4;
            opacity: 0.95;
        }

        .cta {
            margin-top: 40px;
            display: inline-block;
            padding: 16px 36px;
            background: linear-gradient(135deg, #ff9f1a, #ff7a00);
            color: #000;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 40px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,159,26,0.4);
        }

        /* WhatsApp flottant */
        .whatsapp {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #25D366;
            color: #fff;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 1000;
        }

        .whatsapp:hover {
            background: #1ebe5d;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .hero {
                background-size: cover;
                background-position: center top;
            }

            .cta {
                padding: 14px 28px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <div class="brand">
                Evidenc’<span>IA</span>
            </div>

            <div class="tagline">
                Nos agents IA au service de votre entreprise
            </div>

            <a href="#agents" class="cta">
                Demander une démo gratuite
            </a>
        </div>
    </section>

    <!-- WhatsApp -->
    <a class="whatsapp"
       href="https://wa.me/33665752635"
       target="_blank">
        WhatsApp
    </a>

</body>
</html>
