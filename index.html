<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidenc’IA — Vos assistants</title>

<style>
:root{
  --bg1:#05060a;
  --bg2:#0a0f1f;
  --ink:#eef2ff;
  --muted:rgba(238,242,255,.72);
  --accent:#ff8c28;

  --cardRadius:26px;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --line:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* ===== TOP CTA ===== */
.top-cta{
  position:fixed;
  top:16px;
  right:16px;
  z-index:10000;
  padding:10px 16px;
  border-radius:999px;
  background:rgba(0,0,0,.4);
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  color:var(--ink);
  text-decoration:none;
  font-weight:900;
  font-size:13px;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(1200px 600px at 50% 20%, rgba(255,140,40,0.25), transparent 60%),
    radial-gradient(1000px 800px at 80% 30%, rgba(80,120,255,0.25), transparent 60%),
    linear-gradient(135deg, #05060a 0%, #0a0f1f 100%);
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(circle at 50% 40%, black 40%, transparent 100%);
}

.hero::after{
  content:"";
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,140,40,0.15), transparent 60%),
    radial-gradient(circle at 70% 60%, rgba(80,120,255,0.15), transparent 60%);
  filter:blur(80px);
}

/* ===== LOGO (MOINS TRANSLUCIDE) ===== */
.hero-logo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:1;
}

.hero-logo img{
  width:70%;
  max-width:900px;

  opacity:0.12; /* 🔥 AVANT 0.06 → PLUS VISIBLE */
  filter:blur(1.5px);

  transform:scale(1.1);
}

/* ===== HERO CONTENT ===== */
.hero-content{
  position:absolute;
  top:65%;
  left:50%;
  transform:translate(-50%, -50%);
  text-align:center;
  max-width:900px;
  z-index:2;
}

@media (max-width:768px){
  .hero-content{ top:60%; }
}

.badge{
  color:var(--accent);
  font-weight:900;
  font-size:13px;
}

.hero h1{
  font-size:56px;
  font-weight:900;
  margin:12px 0;
}

.hero h1 span{color:var(--accent)}

.hero p{
  font-size:18px;
  color:var(--muted);
}

/* ===== SECTION ===== */
.section{
  padding:70px 6vw;
}

.section h2{
  text-align:center;
  font-size:40px;
  margin-bottom:50px;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:34px;
}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
}

/* ===== CARDS ===== */
.agent{
  position:relative;
  height:560px;
  border-radius:var(--cardRadius);
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
}

.media{
  position:absolute;
  inset:0;
  padding:12px 12px 160px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.media img{
  width:100%;
  height:100%;
  object-fit:contain;
  transform:scale(1.2) translateY(30px);
}

.overlay{
  position:absolute;
  bottom:18px;
  left:18px;
  right:18px;
}

.box{
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:18px;
}

.box h3{margin:0;font-size:24px}
.box strong{color:var(--accent);font-size:14px}
.box p{font-size:14px;margin:10px 0;color:var(--muted)}

.box a{
  display:inline-block;
  padding:10px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  text-decoration:none;
  color:white;
  font-weight:900;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:40px;
  color:rgba(255,255,255,.6);
}
</style>
</head>

<body>

<a class="top-cta" href="https://demo.evidencia.me/auth/login">
  Connectez-vous à vos agents
</a>

<section class="hero">

  <div class="hero-logo">
    <img src="images/logopc.png" alt="">
  </div>

  <div class="hero-content">
    <div class="badge">PLATEFORME IA ENTREPRISE</div>

    <h1>
      Vos agents IA<br>
      <span>travaillent pour vous</span>
    </h1>

    <p>
      Marketing, SEO, relation client, téléphonie —
      automatisez votre entreprise avec des agents intelligents.
    </p>
  </div>

</section>

<section class="section" id="agents">
  <h2>Vos assistants</h2>

  <div class="grid">
    <!-- (agents inchangés) -->
  </div>
</section>

<footer>
© 2025 Evidenc’IA — Tous droits réservés
</footer>

</body>
</html>
