<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidenc’IA — Nos agents</title>

  <style>
    :root {
      --bg1: #05060a;
      --bg2: #0a0d16;
      --ink: #eef2ff;
      --muted: rgba(238,242,255,.72);

      --cardRadius: 26px;
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --shadowSoft: 0 14px 40px rgba(0,0,0,.45);

      --line: rgba(255,255,255,.10);
      --wa: #25D366;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow-x: hidden;
    }

    /* Vos styles existants pour le hero, section, agents, etc. */
    /* ... (tout le CSS que vous aviez fourni) ... */
  </style>
</head>

<body>

  <!-- Lien de connexion en haut à droite -->
  <nav style="position:absolute; top:20px; right:20px;">
    <a href="/login" style="color: var(--ink); text-decoration: none; font-weight: bold;">
      Connexion
    </a>
  </nav>

  <section class="hero" aria-label="Evidenc’IA"></section>

  <section class="section" id="agents">
    <h2>Nos agents</h2>

    <div class="grid">
      <!-- Vos articles d'agents ici, tels que vous les avez fournis -->
      <article class="agent" data-fit="tight">
        <div class="media"><img src="images/chloe.png" alt="Chloé" loading="lazy"></div>
        <div class="overlay">
          <div class="box">
            <h3>Chloé</h3>
            <strong>Standardiste</strong>
            <p>Répond aux appels, qualifie les demandes et oriente vos clients.</p>
            <a href="agents/chloe.html">En savoir plus</a>
          </div>
        </div>
      </article>

      <article class="agent" data-fit="tight">
        <div class="media"><img src="images/lucas.png" alt="Lucas" loading="lazy"></div>
        <div class="overlay">
          <div class="box">
            <h3>Lucas</h3>
            <strong>Marketing</strong>
            <p>Crée vos contenus, respecte votre charte et publie sur vos réseaux.</p>
            <a href="agents/lucas.html">En savoir plus</a>
          </div>
        </div>
      </article>

      <!-- Autres agents ici (Téo, Max, Rose, Emma) exactement comme vous les avez fournis -->
      <!-- ... -->
    </div>
  </section>

  <div class="floating">
    <!-- Boutons de contact, WhatsApp, etc. inchangés -->
    <!-- ... -->
  </div>

  <footer>© 2025 Evidenc’IA — Tous droits réservés</footer>

</body>
</html>
