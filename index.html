<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidenc’IA — Vos assistants</title>

  <style>
    /* ================= VARIABLES ================= */
    :root{
      --bg1:#05060a;
      --bg2:#0a0d16;
      --ink:#eef2ff;
      --muted:rgba(238,242,255,.72);

      --cardRadius:26px;
      --shadow:0 24px 70px rgba(0,0,0,.55);
      --shadowSoft:0 14px 40px rgba(0,0,0,.45);

      --line:rgba(255,255,255,.10);
      --wa:#25D366;

      --bubbleShift:34px;
    }

    /* =============== MODE CLAIR =============== */
    :root[data-theme="light"]{
      --bg1:#f6f7fb;
      --bg2:#ffffff;
      --ink:#0b0d17;
      --muted:rgba(11,13,23,.65);

      --line:rgba(0,0,0,.12);

      --shadow:0 20px 50px rgba(0,0,0,.18);
      --shadowSoft:0 12px 28px rgba(0,0,0,.15);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:"Segoe UI", Arial, sans-serif;
      color:var(--ink);
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
      transition:background .25s ease,color .25s ease;
    }

    /* ================= HEADER ================= */
    .header{
      position:fixed;
      top:16px;
      left:16px;
      right:16px;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    /* LOGOS */
    .logo img{
      height:42px;
      display:none;
    }
    :root[data-theme="dark"] .logo-dark{display:block}
    :root[data-theme="light"] .logo-light{display:block}

    /* ================= SWITCH ================= */
    .theme-switch{
      display:flex;
      align-items:center;
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
      box-shadow:var(--shadowSoft);
    }

    .theme-switch button{
      padding:10px 16px;
      border:none;
      background:transparent;
      color:var(--muted);
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      transition:.15s ease;
    }

    .theme-switch button.active{
      background:rgba(255,255,255,.14);
      color:var(--ink);
    }

    /* ================= CTA LOGIN ================= */
    .top-cta{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid var(--line);
      backdrop-filter:blur(10px);
      box-shadow:var(--shadowSoft);
      color:var(--ink);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
    }

    .top-cta svg{width:18px;height:18px;fill:currentColor}

    /* ================= HERO ================= */
    .hero{
      height:100vh;
      background:url("images/logopc.png") center/cover no-repeat;
      position:relative;
    }

    @media(max-width:768px){
      .hero{
        background:url("images/logomobile.png") center 10%/cover no-repeat;
      }
    }

    .hero::after{
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.25));
    }

    /* ================= SECTION ================= */
    .section{
      padding:70px 6vw 70px;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
    }

    .section h2{
      text-align:center;
      font-size:40px;
      margin-bottom:50px;
    }

    /* ================= AGENT ================= */
    .agent{
      max-width:420px;
      margin:0 auto;
      height:560px;
      border-radius:var(--cardRadius);
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
    }

    .media{
      position:absolute;
      inset:0;
      padding:12px 12px 165px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .media img{
      width:100%;
      height:100%;
      object-fit:contain;
      transform:translateY(var(--bubbleShift)) scale(1.18);
      filter:drop-shadow(0 28px 52px rgba(0,0,0,.6));
    }

    .overlay{
      position:absolute;
      bottom:18px;
      left:18px;
      right:18px;
    }

    .box{
      background:rgba(0,0,0,.45);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      backdrop-filter:blur(10px);
    }

    :root[data-theme="light"] .box{
      background:rgba(255,255,255,.85);
    }

    .box h3{margin:0;font-size:26px}
    .box strong{display:block;margin:6px 0 10px}
    .box p{font-size:14px;color:var(--muted)}

    .box a{
      display:inline-block;
      margin-top:10px;
      padding:10px 16px;
      border-radius:999px;
      border:1px solid var(--line);
      text-decoration:none;
      color:var(--ink);
      font-weight:900;
      font-size:14px;
    }

    footer{
      text-align:center;
      padding:40px;
      border-top:1px solid var(--line);
      font-size:13px;
      color:var(--muted);
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <div class="header">

    <!-- LOGO -->
    <div class="logo">
      <img src="images/logo-sombre.png" alt="Evidenc’IA" class="logo-dark">
      <img src="images/logo-clair.png" alt="Evidenc’IA" class="logo-light">
    </div>

    <!-- SWITCH -->
    <div class="theme-switch">
      <button id="btn-light">Clair</button>
      <button id="btn-dark" class="active">Sombre</button>
    </div>

    <!-- LOGIN -->
    <a class="top-cta" href="https://evidencia-app.vercel.app/login">
      <svg viewBox="0 0 24 24">
        <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/>
      </svg>
      Connectez-vous
    </a>

  </div>

  <section class="hero"></section>

  <section class="section">
    <h2>Votre assistante</h2>

    <article class="agent">
      <div class="media">
        <img src="images/chloe.png" alt="Chloé">
      </div>
      <div class="overlay">
        <div class="box">
          <h3>Chloé</h3>
          <strong>Standardiste</strong>
          <p>Toujours de bonne humeur, à l’écoute de vos clients 24/7.</p>
          <a href="agents/chloe.html">En savoir plus</a>
        </div>
      </div>
    </article>

  </section>

  <footer>© 2025 Evidenc’IA — Tous droits réservés</footer>

  <!-- ================= SCRIPT ================= -->
  <script>
    const root = document.documentElement;
    const btnLight = document.getElementById('btn-light');
    const btnDark = document.getElementById('btn-dark');

    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);

      btnLight.classList.toggle('active', theme === 'light');
      btnDark.classList.toggle('active', theme === 'dark');
    }

    const saved = localStorage.getItem('theme') || 'dark';
    setTheme(saved);

    btnLight.onclick = () => setTheme('light');
    btnDark.onclick = () => setTheme('dark');
  </script>

</body>
</html>
