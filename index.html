<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidenc’IA — Vos assistants</title>

  <style>
    :root{
      --bg1:#05060a;
      --bg2:#0a0d16;
      --ink:#eef2ff;
      --muted:rgba(238,242,255,.72);

      --cardRadius:26px;
      --shadow:0 24px 70px rgba(0,0,0,.55);
      --shadowSoft:0 14px 40px rgba(0,0,0,.45);

      --line:rgba(255,255,255,.10);
      --wa:#25D366;

      --bubbleShift:34px;
    }

    /* ===== MODE CLAIR (AJOUT) ===== */
    :root[data-theme="light"]{
      --bg1:#f6f7fb;
      --bg2:#ffffff;
      --ink:#0b0d17;
      --muted:rgba(11,13,23,.65);
      --line:rgba(0,0,0,.10);
      --shadow:0 24px 60px rgba(0,0,0,.15);
      --shadowSoft:0 14px 30px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:"Segoe UI", Arial, sans-serif;
      color:var(--ink);
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }

    /* ===== SWITCH CLAIR / SOMBRE (AJOUT) ===== */
    .theme-switch{
      position:fixed;
      top:16px;
      right:260px;
      z-index:10001;
      display:flex;
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
      box-shadow:0 14px 40px rgba(0,0,0,.45);
    }

    .theme-switch button{
      padding:10px 16px;
      border:none;
      background:transparent;
      color:var(--muted);
      font-weight:900;
      font-size:13px;
      cursor:pointer;
    }

    .theme-switch button.active{
      background:rgba(255,255,255,.14);
      color:var(--ink);
    }

    @media (max-width:720px){
      .theme-switch{
        right:16px;
        top:70px;
      }
    }

    /* ===== CTA LOGIN (INCHANGÉ) ===== */
    .top-cta{
      position:fixed;
      top:16px;
      right:16px;
      z-index:10000;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid var(--line);
      backdrop-filter:blur(10px);
      box-shadow:0 14px 40px rgba(0,0,0,.45);
      color:var(--ink);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
    }

    .top-cta svg{width:18px;height:18px;fill:currentColor}

    /* ===== HERO (INCHANGÉ + LOGO CLAIR) ===== */
    .hero{
      height:100vh;
      width:100vw;
      position:relative;
      background:url("images/logopc.png") center/cover no-repeat;
    }

    :root[data-theme="light"] .hero{
      background:url("images/logo-clair.png") center/contain no-repeat;
      background-color:#ffffff;
    }

    @media (max-width:768px){
      .hero{
        background:url("images/logomobile.png") center 10%/cover no-repeat;
      }
      :root[data-theme="light"] .hero{
        background:url("images/logo-clair.png") center/contain no-repeat;
      }
    }

    /* ===== SECTION AGENTS (INCHANGÉE) ===== */
    .section{
      padding:70px 6vw 55px;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
    }

    .section h2{
      text-align:center;
      font-size:44px;
      margin-bottom:52px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:34px;
    }

    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
      .section h2{font-size:32px}
    }

    .agent{
      position:relative;
      height:560px;
      border-radius:var(--cardRadius);
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
    }

    .media{
      position:absolute;
      inset:0;
      padding:12px 12px 165px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .media img{
      width:100%;
      height:100%;
      object-fit:contain;
      transform:translateY(var(--bubbleShift)) scale(1.18);
      filter:drop-shadow(0 28px 52px rgba(0,0,0,.6));
    }

    .overlay{
      position:absolute;
      bottom:18px;
      left:18px;
      right:18px;
    }

    .box{
      background:rgba(0,0,0,.45);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      backdrop-filter:blur(10px);
    }

    :root[data-theme="light"] .box{
      background:rgba(255,255,255,.85);
    }

    .box h3{margin:0;font-size:26px}
    .box strong{display:block;margin:6px 0 10px}
    .box p{font-size:14px;color:var(--muted)}

    footer{
      text-align:center;
      padding:40px;
      border-top:1px solid var(--line);
      font-size:13px;
      color:var(--muted);
    }
  </style>
</head>

<body>

  <!-- SWITCH (AJOUT) -->
  <div class="theme-switch">
    <button id="btn-light">Clair</button>
    <button id="btn-dark" class="active">Sombre</button>
  </div>

  <!-- LOGIN (INCHANGÉ) -->
  <a class="top-cta" href="https://evidencia-app.vercel.app/login">
    <svg viewBox="0 0 24 24">
      <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/>
    </svg>
    Connectez-vous
  </a>

  <section class="hero"></section>

  <section class="section">
    <h2>Vos assistants</h2>

    <div class="grid">
      <!-- Chloé -->
      <article class="agent"><div class="media"><img src="images/chloe.png"></div></article>
      <!-- Lucas -->
      <article class="agent"><div class="media"><img src="images/lucas.png"></div></article>
      <!-- Téo -->
      <article class="agent"><div class="media"><img src="images/teo.png"></div></article>
      <!-- Max -->
      <article class="agent"><div class="media"><img src="images/max.png"></div></article>
      <!-- Rose -->
      <article class="agent"><div class="media"><img src="images/rose.png"></div></article>
      <!-- Emma -->
      <article class="agent"><div class="media"><img src="images/emma.png"></div></article>
    </div>
  </section>

  <footer>© 2025 Evidenc’IA — Tous droits réservés</footer>

  <!-- SCRIPT SWITCH (AJOUT) -->
  <script>
    const root = document.documentElement;
    const btnLight = document.getElementById('btn-light');
    const btnDark = document.getElementById('btn-dark');

    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      btnLight.classList.toggle('active', theme === 'light');
      btnDark.classList.toggle('active', theme === 'dark');
    }

    setTheme(localStorage.getItem('theme') || 'dark');

    btnLight.onclick = () => setTheme('light');
    btnDark.onclick = () => setTheme('dark');
  </script>

</body>
</html>
